name: Deploy Next.js to EC2 Automation Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-xylozen
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Standalone & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Next.js Standalone Bundle
        run: npm run build

      - name: 📦 Package Standalone Artifact
        run: |
          mkdir -p /tmp/artifact
          # Copy standalone server and preserved dotfiles
          cp -a .next/standalone/. /tmp/artifact/
          # Copy static and public assets
          mkdir -p /tmp/artifact/.next
          cp -a .next/static /tmp/artifact/.next/
          cp -a public /tmp/artifact/ 2>/dev/null || true
          tar -czf /tmp/xylozen-deploy.tar.gz -C /tmp/artifact .
          echo "✅ Package created: $(ls -lh /tmp/xylozen-deploy.tar.gz)"

      - name: 🔑 Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          if echo "$SSH_KEY" | grep -q '\\n'; then
            printf "%b\n" "$SSH_KEY" > ~/.ssh/id_rsa
          else
            printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          fi
          sed -i 's/\r$//' ~/.ssh/id_rsa
          if [ -n "$(tail -c1 ~/.ssh/id_rsa 2>/dev/null)" ]; then
            echo "" >> ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          cat << 'EOF_SSH' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF_SSH
          chmod 600 ~/.ssh/config

      - name: 📤 Transfer Artifact to EC2
        env:
          HOST: ${{ secrets.EC2_HOST || secrets.SERVER_IP || '15.135.74.113' }}
          USER: ${{ secrets.EC2_USER || secrets.USERNAME || 'ec2-user' }}
        run: |
          echo "Uploading /tmp/xylozen-deploy.tar.gz to EC2..."
          scp -i ~/.ssh/id_rsa /tmp/xylozen-deploy.tar.gz "${USER}@${HOST}:/tmp/xylozen-deploy.tar.gz"

      - name: 🚀 Execute Atomic Deployment Engine
        env:
          HOST: ${{ secrets.EC2_HOST || secrets.SERVER_IP || '15.135.74.113' }}
          USER: ${{ secrets.EC2_USER || secrets.USERNAME || 'ec2-user' }}
        run: |
          ssh -i ~/.ssh/id_rsa "${USER}@${HOST}" bash -s << 'EOF_DEPLOY'
            set -euo pipefail
            PROJECT="xylozen"
            ARTIFACT="/tmp/xylozen-deploy.tar.gz"
            ENGINE="/opt/devops-automation/scripts/deploy.sh"

            if [[ ! -f "$ENGINE" ]]; then
              echo "❌ ERROR: Deployment engine not found at $ENGINE"
              exit 1
            fi

            echo "🚀 Executing native deployment for $PROJECT..."
            "$ENGINE" "$PROJECT" "$ARTIFACT"
            rm -f "$ARTIFACT"
          EOF_DEPLOY
