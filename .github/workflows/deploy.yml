name: Build & Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        id: image-name
        run: |
          echo "IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.IMAGE_LOWER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and Push Docker Image (Cloud Runner)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Downcase Image Name
        id: image-name
        run: |
          echo "IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy Image to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e

            PROJECT_DIR="/home/${{ secrets.EC2_USER }}/xylozen"
            IMAGE="${{ steps.image-name.outputs.IMAGE_LOWER }}:latest"

            echo "🚀 Deploying pre-built Docker image to $PROJECT_DIR..."
            mkdir -p "$PROJECT_DIR"
            cd "$PROJECT_DIR"

            # Create default .env file if missing
            if [ ! -f .env ]; then
              echo "📝 Creating initial .env template..."
              cat << 'EOF' > .env
            SMTP_HOST=smtp.titan.email
            SMTP_PORT=465
            SMTP_SECURE=true
            SMTP_USER=info@thebytebandits.com
            SMTP_PASS=YourTitanPasswordHere
            SMTP_FROM=support@thebytebandits.com
            OWNER_EMAIL=support@thebytebandits.com
            BACKEND_API_URL=http://localhost:4000/api
            EOF
            fi

            # Authenticate with GHCR on EC2
            echo "${{ secrets.GHCR_TOKEN || secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            # Update minimal docker-compose.yml (Only runs pre-built image, connected to internal network)
            cat << 'EOF' > docker-compose.yml
            services:
              xylozen-app:
                image: IMAGE_PLACEHOLDER
                container_name: xylozen-app
                restart: unless-stopped
                env_file:
                  - .env
                environment:
                  - PORT=3000
                  - NODE_ENV=production
                expose:
                  - "3000"
                networks:
                  - app
                deploy:
                  resources:
                    limits:
                      memory: 512M

            networks:
              app:
                name: dashboard_app
                external: true
            EOF

            sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" docker-compose.yml

            echo "📦 Pulling latest pre-built image ($IMAGE)..."
            docker compose pull xylozen-app

            echo "🔄 Launching updated container..."
            docker compose up -d --remove-orphans

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Successfully deployed!"
            docker compose ps
